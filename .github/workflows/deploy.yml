name: Deploy Python Models

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Eksekusi SSH ke VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/surauzamzam/models
            git pull origin main
            
            # Buat virtual environment jika belum ada
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            # Install dependensi baru menggunakan pip dari venv
            venv/bin/pip install -r requirements.txt
            
            # Restart service Python di PM2
            pm2 restart models-api